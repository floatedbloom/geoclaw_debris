version: 1
project:
  title: GeoClaw Debris
  copyright: '2025'
  github: rjleveque/geoclaw_debris
  bibliography:
    - docs/references.bib
  exports:
    - format: pdf
      template: plain_latex_book
      output: exports/geoclaw_debris.pdf
  toc:
    - file: index.md
    - title: Overview and introduction
      children:
        - file: docs/python_environment.md
        - file: docs/possible_projects.md
    - file: examples/intro_examples.md
      children:
        - title: Particles without collision avoidance
          children:
            - file: examples/particles.md
        - title: Large objects, avoiding collisions
          children:
            - file: src/geoclaw_debris/Test1.ipynb
            - file: examples/flow_around_cylinder/DebrisCylinder.ipynb
            - file: examples/wavetank1/README.md
              children:
                - file: examples/wavetank1/wavetank1_obstacles.ipynb
    - title: Resources
      children:
        - file: docs/intro_resources.md
        - file: docs/biblio.md
site:
  options:
    logo: images/GeoClawLogoTitle.jpg
    favicon: images/geoclaw-favicon-32x32.png
    folders: true
  template: book-theme
