version: 1
project:
  title: GeoClaw Debris
  copyright: '2025'
  github: rjleveque/geoclaw_debris
  bibliography:
    - docs/references.bib
  exports:
    - format: pdf
      template: plain_latex_book
      output: exports/geoclaw_debris.pdf
  toc:
